[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-b7c-ble"
version = "1.0.0"
description = "Aputure B7C Bluetooth Mesh integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "BigDurl" }]
dependencies = [
  "aiousbwatcher>=1.1.2",
  "bleak>=0.22",
  "bleak-retry-connector>=3",
  "cryptography>=42",
  "homeassistant>=2026.10.4",
  "serialx>=1.11.0",
  "voluptuous>=0.15",
]

[project.urls]
Homepage = "https://github.com/BigDurl/HA-B7C-BLE"
Documentation = "https://github.com/BigDurl/HA-B7C-BLE"
Repository = "https://github.com/BigDurl/HA-B7C-BLE"
Issues = "https://github.com/BigDurl/HA-B7C-BLE/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["custom_components*", "custom_components.b7c_ble*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.b7c_ble" = [
  "manifest.json",
  "strings.json",
  "translations/*.json",
  "brand/*.png",
]
